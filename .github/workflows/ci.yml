name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + typecheck + tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install deps (ci)
        run: npm ci

      # test:ci is the single source of truth for the deterministic suite
      # (lint + typecheck + every no-API test, incl. the webhook HMAC gate).
      # API-spending tests (test:xss/cmdi/pt) live only in `npm test`.
      - name: Run deterministic test suite (test:ci, no API spend)
        run: npm run test:ci
