name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + typecheck + tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install deps (ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run fixture tests
        run: npm run test:fixtures

      - name: Run SARIF smoke test
        run: npm run test:sarif

      - name: Run auth-bypass prefilter test (regex-only, no API)
        run: npm run test:auth-bypass-prefilter

      - name: Run finding-merge collapse test (report-layer, no API)
        run: npm run test:finding-merge

      - name: Run scan-limit-warning test (pure, no API)
        run: npm run test:limit-warning
