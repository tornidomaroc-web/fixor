name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + typecheck + tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install deps (ci)
        run: npm ci

      # test:ci is the single source of truth for the deterministic suite
      # (lint + typecheck + every no-API test, incl. the webhook HMAC gate).
      # Live-LLM detector tests are opt-in only: they require ANTHROPIC_API_KEY,
      # are never part of test:ci, and skip cleanly when the key is absent.
      - name: Run deterministic test suite (test:ci, no API spend)
        run: npm run test:ci
