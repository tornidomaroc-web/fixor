name: secrets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: gitleaks + pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
      # WHOLE-TREE scan. The gitleaks-action step above is a verdict on a commit range only
      # (pull_request: base^..head; push to main: the pushed commit, `--log-opts=-1`). It never
      # reads the tree, so a literal already on main stays green forever (the blog literal sat
      # green from 2026-05-19 to 2026-09-11). This step scans every tracked file of the checked-out
      # commit under the same config. Branch protection requires this job AND requires branches
      # to be up to date with main, so the tree scanned on a pull request IS the tree main would
      # have after the squash merge; the push-to-main run is the read-back of that verdict.
      # Pinned to the release the action's v2 tag defaults to (8.24.3 at ff98106e; GITLEAKS_VERSION
      # is unset above) and checksum-verified against the release's published checksums file, so
      # both steps run the same ruleset. `dir` reads the checked-out files only, never history:
      # a literal that lives only in a superseded commit is outside this step's scope by design.
      - name: gitleaks whole-tree scan (checked-out commit, same config)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 2 \
            --report-format sarif --report-path gitleaks-tree.sarif
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: gitleaks-tree-sarif, path: gitleaks-tree.sarif, if-no-files-found: ignore }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python scripts/secrets_scan.py
